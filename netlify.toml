[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/pl"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/en"
  to = "/en.html"
  status = 301
